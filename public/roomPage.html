<!DOCTYPE html>
<html lang="en">
<head>  
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blitzle.com</title>
    <link rel="stylesheet" href="style.css" />
    <script src="/socket.io/socket.io.js"></script>
    <script>
    const socket = io();
    </script>
    <link rel="icon" href="/iconLogo.png" type="image/png"sizes="10x10">
    <!--Loads icons-->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

</head>
<body>
    <div class="sidebar">
        
        <a class="active" href="index.html"><img src="logo.png" alt="Blitzle.com"width="150px"></a>
        <a href="index.html"><span class="material-symbols-outlined">home</span> Home</a>
        <a href="roomPage.html"><span class="material-symbols-outlined">rss_feed</span> Host / Join</a>
        <a href="gamePage.html"><span class="material-symbols-outlined">computer</span> Local Game</a>
        <a href="gameInfo.html"><span class="material-symbols-outlined">help</span> Game Info</a>
        <!--<a href="gamePage.html?gamemode=Ai"><span class="material-symbols-outlined">Network_Intelligence</span> VS AI</a> -->
        
    </div>
    <div class="content">
        <div id="join-box">
        </div>
        <div id="create-box">
            <form id="createRoom">
                <h1>Create Room</h1>
                <input type="text" placeholder = "Username" id="username">
                <input type="text" placeholder="Room Name" id="roomName">
                <input type="text" placeholder="Password" id="password">
                <h1>Timer</h1>
                <div class="timerButtons">
                    <button type="button" class="btn" data-value= "30">30 sec</button>
                    <button type="button" class="btn" data-value= "180">3 min</button>
                    <button type="button" class="btn" data-value= "300">5 min</button>
                    <button type="button" class="btn" data-value= "600">10 min</button>
                    <button type="button" class="btn" data-value= "900">15 min</button>
                    <button type="button" class="btn" data-value= "1800">30 min</button>
                </div>
                <button class = "submit">Submit</button>
            </form>

        </div>
    </div>

    <!-- Move the script here, so DOM is loaded before JS runs -->
    <script src="tagCreator.js"></script>
</body>
</html>
