<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blitzle.com</title>
    
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.88.2/dist/phaser.js"></script>
    <script src='chessCanvas.js'></script>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="main.js"></script>
</head>
<body>
    <div class="sidebar">
        <a class="active" href="index.html">Home</a>
        <a href="hostjoin.html">Host / Join</a>
        <a href="gamePage.html">Local Game</a>
        <a href="gameInfo.html">Game Info</a>
    </div>
    <div class="content">
        <div id="top-bar"></div>   
        <div id="game-container">
            <div id="game-timer" style="font-size: 24px; margin-top: 10px;">Time: 03:00</div>
            
        </div>
        <div id="info-container">
            <div class="moveHistory">
                <p>Move History</p>
                <ul id="moveHistoryList"></ul>
            </div>
            <div class="timer-words">
                <h2>Black</h2>
                <h2>White</h2>
            </div>
            <div class="game-timers">
                <h1 id="whiteTimer">3:00</h1>
                <h1 id="blackTimer">3:00</h1>
            </div>
        </div>
    </div>

</html>
